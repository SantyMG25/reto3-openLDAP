# /etc/sssd/sssd.conf  (permisos: root:root 600)
[sssd]
services = nss, pam
domains = empresa.test

[domain/empresa.test]
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
access_provider = simple
simple_allow_groups = administradores, empleados
ldap_uri = ldap://68.155.156.234
ldap_search_base = dc=empresa,dc=test
ldap_schema = rfc2307
ldap_id_use_start_tls = true
ldap_tls_reqcert = demand
ldap_tls_cacert = /usr/local/share/ca-certificates/empresa-ldap-ca.crt
ldap_default_bind_dn = cn=sssd,dc=empresa,dc=test
ldap_default_authtok_type = password
ldap_default_authtok = <CONTRASEÑA_DE_LA_CUENTA_SSSD>
cache_credentials = false
